<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Demo App</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    #msg { margin-top: 1rem; color: #0a7d33; }
  </style>
</head>
<body>
  <h1>Demo App</h1>
  <input id="email" type="email" placeholder="you@example.com" />
  <button
    id="submit"
    type="button"
    onclick="var m = document.getElementById('msg'); m.textContent = 'Welcome ' + document.getElementById('email').value; m.style.display = 'block';"
  >
    Submit
  </button>
  <div id="msg" style="display: none;"></div>
</body>
</html>
